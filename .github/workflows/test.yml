name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 22: the oldest pi-kb supports (package.json engines); 24: current.
        node: ["22", "24"]
    env:
      # OCR language data the tests download once (about 40 MB from GitHub), kept between runs.
      PI_KB_TESSDATA: ${{ github.workspace }}/.tessdata
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/cache@v5
        with:
          path: .tessdata
          key: tessdata-v1
      - run: npm ci
      - run: npm run typecheck
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
      - run: npm test
