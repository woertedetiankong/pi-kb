<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi 知识库</title>
<script src="/hub.js"></script>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --side: #efefea; --line: #e4e3dc; --line-strong: #d3d2c9;
  --text: #1f1f1c; --muted: #6d6c64; --faint: #9c9b92;
  --accent: #3d5afe; --accent-soft: #e8ecff; --accent-text: #2a3fc2;
  --ok: #2e9d6a; --idle: #b5b4ab; --warn: #c98a12; --danger: #d4453b;
  --mark: #fff1a8; --user: #f1f0ea; --shadow: 0 1px 2px rgba(20,20,10,.05), 0 4px 16px rgba(20,20,10,.04);
  --r: 10px;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1e1e1c; --side: #1a1a18; --line: #2c2c29; --line-strong: #3a3a36;
    --text: #ecebe6; --muted: #a09f97; --faint: #6f6e67;
    --accent: #7b8cff; --accent-soft: #262b4a; --accent-text: #aab6ff;
    --ok: #4cc38a; --idle: #5c5b55; --warn: #e0a83a; --danger: #f07167;
    --mark: #5a4e14; --user: #262624; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --panel: #1e1e1c; --side: #1a1a18; --line: #2c2c29; --line-strong: #3a3a36;
  --text: #ecebe6; --muted: #a09f97; --faint: #6f6e67;
  --accent: #7b8cff; --accent-soft: #262b4a; --accent-text: #aab6ff;
  --ok: #4cc38a; --idle: #5c5b55; --warn: #e0a83a; --danger: #f07167;
  --mark: #5a4e14; --user: #262624; --shadow: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12px; }

.app { display: grid; grid-template-columns: 232px minmax(320px, 1fr) minmax(360px, 1.2fr); grid-template-rows: 56px 1fr; height: 100vh; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { font-weight: 650; letter-spacing: .2px; white-space: nowrap; display: flex; align-items: center; gap: 8px; min-width: 200px; }
.pi-web-multi .brand-name { display: none; }
.pi-web-multi .brand { min-width: 0; }
.brand .logo { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; }
.search { flex: 1; max-width: 560px; position: relative; }
.search input { width: 100%; height: 36px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--text); border-radius: 8px; padding: 0 34px; font: inherit; outline: none; }
.search input:focus { border-color: var(--accent); background: var(--panel); box-shadow: 0 0 0 3px var(--accent-soft); }
.search svg { position: absolute; left: 11px; top: 10px; color: var(--faint); }
.search kbd { position: absolute; right: 10px; top: 8px; }
kbd { font: 11px var(--mono); color: var(--faint); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { padding: 5px 10px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button.on { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.seg button.on.off { background: var(--user); color: var(--muted); }
.spacer { flex: 1; }

aside { background: var(--side); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 8px 24px; display: flex; flex-direction: column; }
.nav-label { font-size: 11px; font-weight: 600; color: var(--faint); letter-spacing: .6px; padding: 12px 10px 4px; }
.nav { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 10px; border-radius: 7px; text-align: left; color: var(--text); }
.nav:hover { background: color-mix(in srgb, var(--line) 70%, transparent); }
.nav.on { background: var(--panel); box-shadow: var(--shadow); font-weight: 600; }
.nav .ico { width: 16px; text-align: center; color: var(--muted); flex: none; }
.nav .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .cnt { font: 11.5px var(--mono); color: var(--faint); }
.nav.sub { padding-left: 34px; font-size: 13px; color: var(--muted); }
.nav.sub.on { color: var(--text); }
.side-foot { margin-top: auto; padding: 16px 10px 0; font-size: 12px; color: var(--faint); overflow-wrap: anywhere; }
.side-foot button { color: var(--accent-text); font-size: 12px; }

main { overflow-y: auto; border-right: 1px solid var(--line); }
.list-head { position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); padding: 14px 20px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.list-head h2 { margin: 0; font-size: 16px; font-weight: 650; }
.list-head .sub { color: var(--muted); font-size: 12.5px; }
.progress { width: 100%; font-size: 12.5px; color: var(--muted); }
.spin { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.group { padding: 4px 12px 8px; }
.card { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: var(--r); border: 1px solid transparent; margin-bottom: 2px; }
.card:hover { background: var(--panel); border-color: var(--line); }
.card.on { background: var(--panel); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.card .row1 { display: flex; align-items: center; gap: 8px; }
.card .title { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .time { color: var(--muted); flex: none; }
.card .summary { color: var(--muted); font-size: 13px; margin: 3px 0 0 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card .meta { display: flex; gap: 6px; align-items: center; margin: 5px 0 0; font-size: 11.5px; color: var(--faint); flex-wrap: wrap; }
.kind { font-size: 11px; font-weight: 600; border-radius: 4px; padding: 0 6px; background: var(--user); color: var(--muted); flex: none; }
.kind.note { background: var(--accent-soft); color: var(--accent-text); }
.scope { font-size: 11px; font-weight: 600; border-radius: 4px; padding: 0 6px; flex: none; border: 1px solid var(--line-strong); color: var(--muted); }
.scope.project { border-color: color-mix(in srgb, var(--ok) 45%, transparent); color: var(--ok); }
.target { padding: 10px 10px 0; font-size: 12px; color: var(--faint); }
.target .seg { margin-top: 4px; display: flex; }
.target .seg button { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.cite { color: var(--accent-text); font-weight: 600; }
.sem { font-size: 11px; font-weight: 600; border-radius: 4px; padding: 0 6px; background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.sem-line { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
.ask-model { height: 32px; max-width: 170px; border: 1px solid var(--line-strong); border-radius: 7px; padding: 0 6px; font: inherit; font-size: 12.5px; background: var(--panel); color: var(--muted); outline: none; margin-left: -8px; }
.ask-model:focus { border-color: var(--accent); }
.answer { margin: 4px 0 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); box-shadow: var(--shadow); }
.answer-head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.answer-head b { color: var(--text); font-size: 13px; }
.answer-head .q { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.answer-head button { width: 24px; height: 24px; border-radius: 6px; color: var(--faint); flex: none; }
.answer-head button:hover { background: var(--bg); color: var(--text); }
.answer .md { font-size: 14px; }
.answer .md p:last-child { margin-bottom: 0; }
.answer .ref { display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px; margin: 0 1px; border-radius: 5px; background: var(--accent-soft); color: var(--accent-text); font: 600 11px var(--mono); vertical-align: 1px; }
.answer .ref:hover { background: var(--accent); color: #fff; }
.answer-src { display: grid; gap: 2px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.answer-src button { display: flex; gap: 8px; align-items: baseline; text-align: left; font-size: 12.5px; color: var(--accent-text); padding: 2px 0; }
.answer-src button:hover { text-decoration: underline; }
.answer-src .num { color: var(--faint); flex: none; }
.answer .fine { margin: 8px 0 0; font-size: 11.5px; color: var(--faint); }
.answer .none { color: var(--muted); margin: 0; }
.answer .bad { color: var(--danger); margin: 0; font-size: 13px; }
.tag { color: var(--accent-text); }
button.tag:hover, .wikilink:hover { text-decoration: underline; }
.wikilink { color: var(--accent-text); font: inherit; }
.wikilink.broken { color: var(--faint); text-decoration: line-through dotted; cursor: help; }
.side-tags { display: flex; flex-wrap: wrap; gap: 4px 8px; padding: 2px 10px 4px; font-size: 12.5px; }
.side-tags button { color: var(--muted); }
.side-tags button.on { color: var(--accent-text); font-weight: 600; }
.side-tags .cnt { font: 11px var(--mono); color: var(--faint); margin-left: 2px; }
.hint-line { margin: 10px 20px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); font-size: 12.5px; color: var(--muted); }
.hint-line button { color: var(--accent-text); font-size: 12.5px; margin-left: 4px; }
.similar { margin: 0 0 12px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); font-size: 13px; }
.similar button { display: block; color: var(--accent-text); font-size: 13px; padding: 2px 0; text-align: left; }
.empty { padding: 60px 24px; text-align: center; color: var(--faint); }
.empty .btn { margin-top: 14px; }

section.preview { overflow-y: auto; background: var(--panel); }
.pv { padding: 22px 26px 60px; max-width: 820px; }
.pv h1 { font-size: 19px; margin: 0 0 4px; line-height: 1.35; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 12.5px; margin: 14px 0 16px; padding: 12px 14px; background: var(--bg); border-radius: 8px; }
.facts dt { color: var(--faint); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.btn { height: 32px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line-strong); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: default; }
.back { display: none; }

.page-mark { display: flex; align-items: center; gap: 8px; margin: 26px 0 10px; font-size: 12px; color: var(--faint); scroll-margin-top: 12px; }
.page-mark::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.page-mark button { color: var(--accent-text); font-size: 12px; }
.page-mark.hit { color: var(--accent-text); font-weight: 600; }
.md { font-size: 14px; line-height: 1.65; overflow-wrap: anywhere; }
.md h1, .md h2, .md h3, .md h4 { line-height: 1.35; margin: 20px 0 8px; }
.md h1 { font-size: 18px; } .md h2 { font-size: 16px; } .md h3, .md h4 { font-size: 14.5px; }
.md p { margin: 0 0 10px; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
.md code { font: 12.5px var(--mono); background: var(--bg); border-radius: 4px; padding: 1px 4px; }
.md pre { font: 12.5px/1.5 var(--mono); background: var(--bg); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 0 0 10px; padding: 2px 12px; border-left: 3px solid var(--line-strong); color: var(--muted); }
.md table { border-collapse: collapse; margin: 0 0 12px; font-size: 13px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
.md th { background: var(--bg); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
.md a { color: var(--accent-text); }
.stats { display: flex; gap: 12px; margin: 16px 0 18px; flex-wrap: wrap; }
.stat { flex: 1; min-width: 120px; background: var(--bg); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }
.stat b { font-size: 24px; font-weight: 650; }
.stat span { color: var(--muted); font-size: 12.5px; }
.tips { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; line-height: 1.8; }
.warn-line { color: var(--warn); font-size: 13px; }
.pv img.orig { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); margin-bottom: 16px; }
textarea.editor { width: 100%; min-height: 420px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 12px; font: 13px/1.6 var(--mono); background: var(--bg); color: var(--text); resize: vertical; outline: none; }
textarea.editor:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: .2s; pointer-events: none; max-width: calc(100vw - 32px); z-index: 30; }
.toast.show { opacity: 1; transform: translateX(-50%); }
.toast.show.actionable { pointer-events: auto; }
.toast button { color: inherit; font-weight: 650; text-decoration: underline; margin-left: 10px; }

dialog.dlg { width: min(620px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--panel); color: var(--text); box-shadow: 0 16px 48px rgba(0,0,0,.25); }
dialog.dlg::backdrop { background: rgba(0,0,0,.35); }
.dlg-head { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dlg-head h2 { margin: 0; font-size: 16px; flex: 1; }
.dlg-head button { width: 28px; height: 28px; border-radius: 6px; color: var(--muted); }
.dlg-head button:hover { background: var(--bg); }
.dlg form { padding: 14px 18px 16px; display: grid; gap: 10px; }
.dlg label { font-size: 12.5px; color: var(--muted); display: grid; gap: 4px; }
.dlg input[type=text] { height: 34px; border: 1px solid var(--line-strong); border-radius: 7px; padding: 0 10px; font: inherit; background: var(--bg); color: var(--text); outline: none; }
.dlg input[type=text]:focus { border-color: var(--accent); }
.dlg textarea.editor { min-height: 220px; }
.dlg .row { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.dlg .fine { font-size: 12px; color: var(--muted); margin-right: auto; }
.dlg .fine button { color: var(--accent-text); text-decoration: underline; font-size: 12px; }
.dlg .err { color: var(--danger); font-size: 12.5px; }
.dlg form p { margin: 0; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
.dlg input[type=password] { height: 34px; border: 1px solid var(--line-strong); border-radius: 7px; padding: 0 10px; font: inherit; background: var(--bg); color: var(--text); outline: none; }
.dlg input[type=password]:focus { border-color: var(--accent); }
.dlg .seg { justify-self: start; }
.dlg [data-mode] { display: grid; gap: 10px; }
.dlg h3 { margin: 4px 0 0; font-size: 14px; }
.dlg .loc-now { font-size: 13px; overflow-wrap: anywhere; }
.dlg .loc-now .num { font-size: 12.5px; }
.dlg #locEdit { display: grid; gap: 10px; }
.dlg label.check { display: flex; gap: 6px; align-items: center; color: var(--text); font-size: 13px; }
.dlg .loc-actions { display: flex; gap: 12px; align-items: center; }
.dlg h3 + .seg { margin-top: -2px; }
.dlg hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0 0; width: 100%; }
.dlg select { height: 34px; border: 1px solid var(--line-strong); border-radius: 7px; padding: 0 8px; font: inherit; background: var(--bg); color: var(--text); outline: none; }
.dlg select:focus { border-color: var(--accent); }
.dlg p.hint { font-size: 13px; color: var(--muted); }
.dlg details { font-size: 12.5px; color: var(--muted); }
.dlg details summary { cursor: pointer; }
.dlg details label { margin-top: 8px; }
.dlg .link { color: var(--accent-text); font-size: 12px; text-decoration: underline; }
.dlg .state { font-size: 13px; color: var(--muted); white-space: pre-line; overflow-wrap: anywhere; }
.dlg .state.bad { color: var(--danger); }
.sem-line button, .warn-line button { color: var(--accent-text); font-size: 13px; margin-left: 6px; }

.drop { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(3px); display: grid; padding: 40px; }
.drop div { border: 2px dashed var(--line-strong); border-radius: 16px; display: grid; place-content: center; text-align: center; gap: 6px; background: var(--panel); transition: .1s; }
.drop div b { font-size: 18px; }
.drop div span { color: var(--muted); font-size: 13px; max-width: 320px; }
.drop div { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }

@media (max-width: 1080px) {
  .app { grid-template-columns: 210px minmax(0, 1fr); }
  section.preview { display: none; }
  .app.detail section.preview { display: block; position: fixed; inset: 56px 0 0 auto; width: min(620px, 100vw); box-shadow: -8px 0 24px rgba(0,0,0,.12); z-index: 5; }
  .back { display: inline-flex; }
}
@media (max-width: 720px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr; height: auto; min-height: 100vh; }
  header { flex-wrap: wrap; padding: 10px 16px; gap: 10px; }
  .brand { min-width: 0; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .ask-model { margin-left: 0; }
  aside { flex-direction: row; flex-wrap: wrap; padding: 6px 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  aside .nav { width: auto; }
  .nav-label, .side-foot { display: none; }
  .app.detail section.preview { inset: 0; width: 100vw; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand"><span class="logo">π</span><span class="brand-name" data-t="brand"></span></div>
    <nav id="pi-web-nav"></nav>
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <button class="btn" id="askBtn"></button>
    <select class="ask-model" id="askModel"></select>
    <div class="spacer"></div>
    <div class="seg" id="enabledSeg"><button data-v="on"></button><button data-v="off"></button></div>
    <button class="btn primary" id="upload"></button>
    <input type="file" id="files" multiple hidden>
    <input type="file" id="noteFiles" multiple accept=".md,.markdown,.mdx" hidden>
  </header>
  <aside id="side"></aside>
  <main id="list"><div class="empty" data-t="loading"></div></main>
  <section class="preview" id="preview"></section>
</div>

<div class="drop" id="drop" hidden>
  <div><b data-t="dropTitle"></b><span data-t="dropHint"></span></div>
</div>

<dialog class="dlg" id="newNote">
  <div class="dlg-head"><h2 data-t="newNote"></h2><button data-close aria-label="close">✕</button></div>
  <form method="dialog">
    <label><span data-t="noteTitle"></span><input type="text" name="title" required></label>
    <label><span data-t="noteTags"></span><input type="text" name="tags"></label>
    <label><span data-t="noteBody"></span><textarea class="editor" name="body" required></textarea></label>
    <div class="similar" id="newNoteSimilar" hidden></div>
    <div class="err" id="newNoteErr" hidden></div>
    <div class="row"><span class="fine"><button type="button" id="importNotes" data-t="importNotesLink"></button></span><button type="button" class="btn" data-close data-t="cancel"></button><button class="btn primary" data-t="save"></button></div>
  </form>
</dialog>

<dialog class="dlg" id="versionDlg">
  <div class="dlg-head"><h2 data-t="versionTitle"></h2></div>
  <form method="dialog">
    <p id="versionText"></p>

const state = { status: null, docs: [], view: "all", q: "", hits: null, selected: null, focusPage: null, doc: null, editing: false, uploading: "", answer: null };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---- API ----
async function api(path, { body, raw, etag } = {}) {
  let res;
  const headers = { "x-token": TOKEN };
  if (etag) headers["if-none-match"] = etag;
  const init = raw !== undefined ? { method: "POST", headers: { ...headers, "content-type": "application/octet-stream" }, body: raw }
    : body !== undefined ? { method: "POST", headers: { ...headers, "content-type": "application/json" }, body: JSON.stringify(body) }
    : { headers };
  try { res = await fetch("/api/kb" + path, init); } catch { throw new Error(T.offline); }
  if (res.status === 304) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  if (etag !== undefined) data.etag = res.headers.get("etag");
  return data;
}

// ---- Markdown (input is untrusted document text: escape first, then add a small set of tags) ----
function inline(s, { links } = {}) {
  let html = esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  // [[note]], [[note|label]], [[note#heading]]: the server says where each goes (null: missing).
  if (links) html = html.replace(/\[\[([^\]|#\n]+)(#[^\]|\n]*)?(?:\|([^\]\n]*))?\]\]/g, (whole, target, heading, label) => {
    const to = links[unesc(target).trim()];
    const text = label || target + (heading || "");
    return to === undefined ? whole : to ? `<button class="wikilink" data-note="${esc(to.id)}" title="${esc(to.title)}">${text}</button>` : `<span class="wikilink broken" title="${esc(T.linkMissing)}">${text}</span>`;
  });
  return html;
}
const unesc = s => s.replace(/&(amp|lt|gt|quot|#39);/g, (_, e) => ({ amp: "&", lt: "<", gt: ">", quot: '"', "#39": "'" }[e]));
function markdown(text, { pdf, hitPage, links } = {}) {
  const inl = s => inline(s, { links });
  const lines = text.replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let i = 0;
  const para = [];
  // Keep single line breaks: notes are usually written one fact per line.
  const flush = () => { if (para.length) { out.push(`<p>${para.map(inl).join("<br>")}</p>`); para.length = 0; } };
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if ((m = /^<!-- kb:page (\d+) -->$/.exec(line))) {
      flush();
      const n = Number(m[1]);
      out.push(`<div class="page-mark${n === hitPage ? " hit" : ""}" id="p-${n}">${esc(T.page(n))}${pdf ? ` <button data-page="${n}">${esc(T.viewPage)} ↗</button>` : ""}</div>`);
      i++; continue;
    }
    if (/^<!-- kb:(source .*|ocr \d+\/\d+) -->$/.test(line)) { i++; continue; }
    if (/^```/.test(line)) {
      flush();
      const code = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      i++;
      out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
      continue;
    }
    if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) { flush(); const h = Math.min(4, m[1].length); out.push(`<h${h}>${inl(m[2])}</h${h}>`); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) {
      flush();
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const sep = rows[1] && /^[\s|:-]+$/.test(rows[1]);
      const head = sep ? `<thead><tr>${cells(rows[0]).map(c => `<th>${inl(c)}</th>`).join("")}</tr></thead>` : "";
      const bodyRows = (sep ? rows.slice(2) : rows).map(r => `<tr>${cells(r).map(c => `<td>${inl(c)}</td>`).join("")}</tr>`).join("");
      out.push(`<table>${head}<tbody>${bodyRows}</tbody></table>`);
      continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
      flush();
      const ordered = /^\s*\d/.test(line);
      const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, ""));
      out.push(`<${ordered ? "ol" : "ul"}>${items.map(x => `<li>${inl(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`);
      continue;
    }
    if (/^>\s?/.test(line)) {
      flush();
      const quote = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) quote.push(lines[i++].replace(/^>\s?/, ""));
      out.push(`<blockquote>${inl(quote.join(" "))}</blockquote>`);
      continue;
    }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); out.push("<hr>"); i++; continue; }
    if (!line.trim()) { flush(); i++; continue; }
    para.push(line.trim());
    i++;
  }
  flush();
  return out.join("\n");
}

/** A note's body without its opening "# Title" when that repeats the title shown above it. */
function withoutTitle(body, title) {
  const m = /^\s*#\s+(.+)\n?/.exec(body);
  return m && m[1].trim().toLowerCase() === title.trim().toLowerCase() ? body.slice(m[0].length) : body;
}

/** Split "---" front matter from a note for display. */
function splitNote(text) {
  const m = /^---\n([\s\S]*?)\n---\n?/.exec(text.replace(/\r\n?/g, "\n"));
  if (!m) return { fields: {}, body: text };
  const fields = {};
  for (const line of m[1].split("\n")) { const kv = /^([A-Za-z_]+):\s*(.*)$/.exec(line); if (kv) fields[kv[1]] = kv[2].replace(/^"(.*)"$/, "$1"); }
  return { fields, body: text.slice(m[0].length) };
}

// ---- rendering ----
const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString(LANG === "zh" ? "zh-CN" : "en-US", { year: "numeric", month: "short", day: "numeric" }); };
const kindOf = d => d.collection === "wiki" ? "note" : d.kind;
/** Scope tags only matter when this folder has a project knowledge base. */
const hasProject = () => !!state.status?.project;
const scopeTag = sc => hasProject() && sc ? `<span class="scope ${sc}" title="${esc(T.scopeTip[sc])}">${esc(T.scope[sc])}</span>` : "";
let target = (() => { try { return JSON.parse(localStorage.getItem("pi-kb-prefs") || "{}").target || "project"; } catch { return "project"; } })();
const targetScope = () => hasProject() ? target : "global";
function highlight(text, q) {
  let html = esc(text);
  const words = q.toLowerCase().split(/\s+/).filter(w => w.length > 0).sort((a, b) => b.length - a.length);
  for (const w of words) {
    const re = new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    html = html.replace(re, x => `<mark>${x}</mark>`);
  }
  return html;
}

function renderHeader() {
  document.title = T.title;
  document.querySelectorAll("[data-t]").forEach(el => { const v = T[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  $("q").placeholder = T.search;
  $("upload").textContent = T.upload;
  $("askBtn").textContent = T.ask;
  $("askBtn").title = T.askTip;
  const seg = $("enabledSeg");
  seg.title = T.enabledTip;
  const on = state.status?.enabled;
  seg.querySelector('[data-v="on"]').textContent = T.on;
  seg.querySelector('[data-v="off"]').textContent = T.off;
  seg.querySelector('[data-v="on"]').classList.toggle("on", on === true);
  const offBtn = seg.querySelector('[data-v="off"]');
  offBtn.classList.toggle("on", on === false);
  offBtn.classList.toggle("off", on === false);
}

function renderSide() {
  const docs = state.docs, count = k => docs.filter(d => kindOf(d) === k).length;
  const nav = (view, ico, name, cnt, sub, tip) => `<button class="nav${sub ? " sub" : ""}${state.view === view && !state.hits ? " on" : ""}" data-view="${view}"${tip ? ` title="${esc(tip)}"` : ""}><span class="ico">${ico}</span><span class="name">${esc(name)}</span><span class="cnt">${cnt}</span></button>`;
  const kinds = ["pdf", "office", "image", "text"].filter(k => count(k));
  $("side").innerHTML = `
    <div class="nav-label">${esc(T.views)}</div>
    ${nav("all", "◎", T.all, docs.length)}
    ${nav("docs", "▤", T.docs, docs.filter(d => d.collection === "docs").length, false, T.docsTip)}
    ${kinds.map(k => nav("kind:" + k, "", T.kinds[k], count(k), true)).join("")}
    ${nav("wiki", "✎", T.notes, count("note"), false, T.notesTip)}
    ${hasProject() ? `${nav("scope:project", "📁", `${T.viewProject} · ${state.status.project.name}`, docs.filter(d => d.scope === "project").length)}${nav("scope:global", "👤", T.viewGlobal, docs.filter(d => d.scope === "global").length)}` : ""}
    ${sideTags()}
    <div class="nav-label">${esc(T.actions)}</div>
    <button class="nav" id="newNoteBtn"><span class="ico">＋</span><span class="name">${esc(T.newNote)}</span></button>
    <button class="nav" id="semBtn"><span class="ico">⚙</span><span class="name">${esc(T.settings)}</span></button>
    ${hasProject() ? `<div class="target">${esc(T.target)}<div class="seg" id="targetSeg"><button data-target="project" class="${target === "project" ? "on" : ""}" title="${esc(T.targetProject(state.status.project.name))} · ${esc(state.status.project.dir)}">${esc(T.scope.project)}</button><button data-target="global" class="${target === "global" ? "on" : ""}" title="${esc(T.scopeTip.global)}">${esc(T.scope.global)}</button></div></div>` : ""}
    <div class="side-foot">${esc(T.folder)}<br>${esc(state.status?.root ?? "")}</div>`;
}

/** The notes' tags, most used first (at most 16), to browse by. */
function sideTags() {
  const counts = new Map();
  for (const d of state.docs) for (const t of d.tags || []) counts.set(t, (counts.get(t) || 0) + 1);
  if (!counts.size) return "";
  const top = [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 16);
  return `<div class="nav-label">${esc(T.tags)}</div><div class="side-tags">${top.map(([t, n]) => `<button data-view="tag:${esc(t)}" class="${state.view === "tag:" + t && !state.hits ? "on" : ""}">#${esc(t)}<span class="cnt">${n}</span></button>`).join("")}</div>`;
}

function visibleDocs() {
  const v = state.view;
  if (v.startsWith("tag:")) return state.docs.filter(d => d.tags?.includes(v.slice(4)));
  return state.docs.filter(d => v === "all" || (v === "docs" && d.collection === "docs") || (v === "wiki" && d.collection === "wiki") || (v.startsWith("kind:") && kindOf(d) === v.slice(5)) || (v.startsWith("scope:") && d.scope === v.slice(6)));
}

function card(d, extra = "") {
  const k = kindOf(d);
  return `<button class="card${state.selected === d.id ? " on" : ""}" data-id="${esc(d.id)}">
    <div class="row1">${scopeTag(d.scope)}<span class="kind${k === "note" ? " note" : ""}">${esc(T.kinds[k] ?? k)}</span><span class="title">${esc(d.title)}</span><span class="time num">${esc(fmtDate(d.added_at))}</span></div>
    ${extra}
    <div class="meta">${d.pages ? `<span>${esc(T.pages(d.pages))}</span>` : ""}<span class="num">${esc(d.id)}</span></div>
  </button>`;
}

/** The AI answer card: question, answer with clickable [n] citations, and the cited sources. */
function answerCard() {
  const a = state.answer;
  if (!a) return "";
  const head = `<div class="answer-head">✨ <b>${esc(T.askTitle)}</b><span class="q">${esc(a.question)}</span><button id="askClose" aria-label="close">✕</button></div>`;
  if (a.loading) return `<div class="answer">${head}<div class="progress"><span class="spin"></span>${esc(T.askLoading)}</div></div>`;
  if (a.error) return `<div class="answer">${head}<p class="bad">${esc(a.error)}</p></div>`;
  const r = a.result;
  if (!r.answer) return `<div class="answer">${head}<p class="none">${esc(T.askNone)}</p>${r.queries.length ? `<p class="fine">${esc(T.askSearched(r.queries.join(" · ")))}</p>` : ""}</div>`;
  const body = markdown(r.answer).replace(/\[(\d+)\]/g, (whole, n) => r.sources[n - 1] ? `<button class="ref" data-ref="${n}" title="${esc(r.sources[n - 1].title)}">${n}</button>` : whole);
  const cite = s => s.page ? `${s.title} · ${T.page(s.page)}` : s.title;
  const sources = r.sources.map(s => `<button data-ref="${s.n}"><span class="num">[${s.n}]</span>${scopeTag(s.scope)}<span>${esc(cite(s))}</span></button>`).join("");
  return `<div class="answer">${head}<div class="md">${body}</div>${sources ? `<div class="answer-src">${sources}</div>` : ""}
    <p class="fine">${esc(T.askCheck)} ${esc(T.answeredBy(modelName(r.model)))}${r.queries.length ? ` ${esc(T.askSearched(r.queries.join(" · ")))}` : ""}</p></div>`;
}

const importingText = im => T.importing(im.done + 1, im.total, im.current) + (im.note && T.importNotes[im.note] ? ` · ${T.importNotes[im.note]}` : "");

function renderList() {
  const im = state.status?.imports;
  const busy = state.uploading || (im?.active && im.current ? importingText(im) : "");
  const progress = busy ? `<div class="progress"><span class="spin"></span>${esc(busy)}</div>` : "";
  if (state.hits) {
    const hits = state.hits;
    const body = hits.length
      ? hits.map(h => {
          const cite = h.page ? `${h.title} · ${T.page(h.page)}` : h.title;
          return `<button class="card${state.selected === h.docId && state.focusPage === h.page ? " on" : ""}" data-id="${esc(h.docId)}" data-page="${h.page ?? ""}">
            <div class="row1">${scopeTag(h.scope)}<span class="kind${h.collection === "wiki" ? " note" : ""}">${esc(h.collection === "wiki" ? T.kinds.note : T.docs)}</span><span class="title cite">${esc(cite)}</span></div>
            <div class="summary">${highlight(h.snippet, state.q)}</div>
            ${h.heading || h.match === "semantic" ? `<div class="meta">${h.match === "semantic" ? `<span class="sem" title="${esc(T.semanticHitTip)}">${esc(T.semanticHit)}</span>` : ""}${h.heading ? `§ ${esc(h.heading)}` : ""}</div>` : ""}
          </button>`;
        }).join("")
      // Next to an answer to this same question, "no results" would read as a contradiction.
      : state.answer?.question === state.q.trim() ? "" : `<div class="empty">${esc(T.noHits(state.q))}<br><small>${esc(T.noHitsHint)}</small></div>`;
    // Few hits with keywords only: say why (bilingual material needs semantic search to cross languages).
    const hint = hits.length < 3 && state.status?.semantic?.provider === "off" ? `<div class="hint-line">${esc(T.searchKeywordsOnly)}<button id="semOpenList">${esc(T.semSetup)} →</button></div>` : "";
    // Few hits: the AI answer searches with several wordings in both languages. Not once it has answered this question.
    const askFew = hits.length < 3 && state.answer?.question !== state.q.trim() ? `<div class="hint-line">${esc(T.askFew)}<button id="askFew">${esc(T.askFewBtn)} →</button></div>` : "";
    $("list").innerHTML = `<div class="list-head"><h2>${esc(state.q)}</h2><span class="sub">${esc(T.results(hits.length))}</span>${progress}</div><div class="group">${answerCard()}${body}</div>${askFew}${hint}`;
    return;
  }
  const docs = visibleDocs();
  const title = state.view === "all" ? T.all : state.view === "docs" ? T.docs : state.view === "wiki" ? T.notes
    : state.view === "scope:project" ? `${T.viewProject} · ${state.status?.project?.name ?? ""}` : state.view === "scope:global" ? T.viewGlobal
    : state.view.startsWith("tag:") ? T.tagView(state.view.slice(4)) : T.kinds[state.view.slice(5)];
  // While the first files are importing, "empty" would contradict the progress line above.
  const empty = state.docs.length
    ? `<div class="empty">${esc(T.emptyView)}</div>`
    : busy ? `<div class="empty">${esc(T.emptyImporting)}</div>`
    : `<div class="empty"><b>${esc(T.empty)}</b><br>${esc(T.emptyHint)}<br><button class="btn primary" id="emptyUpload">${esc(T.upload)}</button></div>`;
  $("list").innerHTML = `<div class="list-head"><h2>${esc(title)}</h2><span class="sub">${esc(T.items(docs.length))}</span>${progress}</div><div class="group">${answerCard()}${docs.length ? docs.map(d => card(d)).join("") : empty}</div>`;
}

async function renderPreview() {

    </div>`;
    return;
  }
  const pdf = /\.pdf$/i.test(doc.title);
  const image = doc.kind === "image";
  pv.innerHTML = `<div class="pv">${back}
    <h1>${scopeTag(state.doc.scope)} ${esc(doc.title)}</h1>
    <dl class="facts">

      ${doc.pages ? `<dt>${esc(T.pageCount)}</dt><dd>${doc.pages}</dd>` : ""}
      <dt>${esc(T.added)}</dt><dd>${esc(fmtDate(doc.added_at))}</dd>
      <dt>${esc(T.source)}</dt><dd>${esc(doc.source.replace(/^upload:/, ""))}</dd>
      <dt>${esc(T.id)}</dt><dd class="num">${esc(doc.id)}</dd>
    </dl>
    <div class="actions"><button class="btn" id="openOriginal" data-page="${state.focusPage ?? ""}">${esc(T.openOriginal)} ↗</button>${["pdf", "image", "office"].includes(doc.kind) ? `<button class="btn" id="rereadDoc" title="${esc(T.rereadTip)}">${esc(T.reread)}</button>` : ""}${doc.kind === "text" && isMarkdown(doc.source) ? `<button class="btn" id="convertDoc" title="${esc(T.toNoteTip)}">${esc(T.toNote)}</button>` : ""}${moveButton()}<button class="btn danger" id="removeDoc">${esc(T.remove)}</button></div>
    ${image ? `<img class="orig" id="origImg" alt="">` : ""}

function semanticLine(sem) {
  if (sem?.installing != null) return T.semInstalling;
  if (sem?.installError) return T.semInstallFailed;
  if (!sem || sem.provider === "off") return T.semOff;
  if (sem.state === "error") return T.semError;
  if (sem.download != null) return T.semDownload(Math.round(sem.download));
  if (sem.done < sem.total) return T.semIndexing(sem.done, sem.total);
  // Nothing to index yet: "0 chunks" reads like something went wrong.
  return sem.total ? T.semReady(sem.total) : T.semWaiting;
}
function overview() {

// ---- original files: <img> and new tabs cannot send the token header, so fetch and use blob URLs ----
const blobs = new Map();
async function originalUrl(id) {
  if (!blobs.has(id)) {
    const res = await fetch("/api/kb/file?id=" + encodeURIComponent(id), { headers: { "x-token": TOKEN } });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `HTTP ${res.status}`);
    blobs.set(id, URL.createObjectURL(await res.blob()));
  }
  return blobs.get(id);
}
async function loadImage(id) { try { const url = await originalUrl(id); const img = $("origImg"); if (img) img.src = url; } catch {} }
async function openOriginal(id, page) {
  // Open the tab synchronously so the popup blocker allows it, then point it at the file.
  const tab = window.open("", "_blank");
  try { const url = await originalUrl(id); if (tab) tab.location.href = url + (page ? "#page=" + page : ""); else location.href = url; }
  catch (e) { tab?.close(); toast(e.message); }
}

/** A short message; with `action` ({ label, run }) it carries a button and stays longer. */
function toast(msg, action) {
  const t = $("toast");
  t.textContent = msg;
  if (action) {
    const b = document.createElement("button");
    b.textContent = action.label;
    b.addEventListener("click", () => { t.classList.remove("show"); action.run(); });
    t.append(b);
  }
  t.classList.toggle("actionable", !!action);
  t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), action ? 10000 : 3600);
}
function renderAll() { renderHeader(); renderSide(); renderList(); renderPreview(); }

// ---- data ----
let etags = {};
async function refresh() {
  try {
    const [status, docs] = await Promise.all([api("/status", { etag: etags.status || "" }), api("/docs", { etag: etags.docs || "" })]);
    let changed = false;
    if (status) { etags.status = status.etag; state.status = status; changed = true; }
    if (docs) { etags.docs = docs.etag; state.docs = docs.docs; changed = true; }
    if (changed) { renderHeader(); renderSide(); renderList(); if (!state.selected) renderPreview(); }
  } catch (e) { toast(e.message); }
}
async function search() {

  try {
    const { hits } = await api("/search?q=" + encodeURIComponent(q));

/** Ask what to do with a new version of an imported document: "replace", "keep" or "skip". */
function askVersion(name, titles) {
  const dlg = $("versionDlg");
  $("versionText").textContent = T.versionBody(name, titles);
  dlg.returnValue = "";
  dlg.showModal();
  return new Promise(resolve => dlg.addEventListener("close", () => resolve(dlg.returnValue || "skip"), { once: true }));
}

const isMarkdown = name => /\.(md|markdown|mdx)$/i.test(name);

/** Wait for queued import jobs (pi imports one file at a time), showing where the queue is. */
async function waitJobs(jobs) {
  const results = [];
  while (jobs.length) {
    await new Promise(r => setTimeout(r, 800));
    try {
      const im = (await api("/status")).imports;
      if (im?.active && im.current) { state.uploading = importingText(im); renderList(); }
      for (const id of [...jobs]) {
        const r = await api(`/import?job=${id}`);
        if (r.done) { results.push(...r.results); jobs.splice(jobs.indexOf(id), 1); }
      }
    } catch (e) { toast(e.message); break; }
  }
  state.uploading = "";
  return results;
}

/**
 * Upload files for import. `note` true/false forces notes/documents; unset, Markdown files become
 * notes and everything else documents, and the toast offers to import those notes as documents instead.
 */
async function upload(files, note) {
  const list = [...files];
  if (!list.length) return;
  const asNote = file => note ?? isMarkdown(file.name);
  const results = [], jobs = [];
  for (const [i, file] of list.entries()) {
    state.uploading = T.sending(i + 1, list.length, file.name); renderList();
    const url = `/upload?name=${encodeURIComponent(file.name)}${asNote(file) ? "&note=1" : ""}&scope=${targetScope()}`;
    try {
      let r = await api(url, { raw: file });
      if (r.versions) {
        const choice = await askVersion(file.name, r.versions);
        if (choice === "skip") { results.push({ status: "skipped", path: file.name, reason: "skippedByUser" }); continue; }
        r = await api(`${url}&onUpdate=${choice}`, { raw: file });
      }
      jobs.push(r.job);
    } catch (e) { results.push({ status: "failed", path: file.name, message: e.message }); }
  }
  results.push(...await waitJobs(jobs));
  etags = {};
  await refresh();
  const n = s => results.filter(r => r.status === s).length;
  const replaced = results.reduce((k, r) => k + (r.replaced?.length ?? 0), 0);
  // Also say where a file already in the other knowledge base is (the page then opens it, with its move button).
  const problems = results.filter(r => r.status === "failed" || r.status === "skipped" || r.reason?.startsWith("in_")).map(r => `${r.doc?.title ?? r.path}: ${T.reasons[r.reason] ?? r.message ?? ""}`);
  const summary = [T.imported(n("added"), n("exists"), n("skipped"), n("failed")), ...(replaced ? [T.replacedN(replaced)] : []), ...problems.slice(0, 2)];
  // Markdown taken as notes without being asked: say so, and offer to import them as documents instead.
  const notes = note === undefined ? results.filter(r => r.status === "added" && r.doc?.collection === "wiki") : [];
  const undo = notes.length && {
    label: T.asDocs,
    run: async () => {
      try {
        const made = [];
        for (const r of notes) made.push((await api("/convert", { body: { id: r.doc.id } })).result);
        etags = {}; await refresh();
        const done = made.filter(r => r.doc);
        if (done.length === 1 && list.length === 1) select(done[0].doc.id);
        toast(done.length === 1 ? T.converted.docs(done[0].doc.title) : T.imported(done.length, 0, 0, made.length - done.length));
      } catch (e) { toast(e.message); }
    },
  };
  toast([...summary, ...(notes.length ? [T.notesImported(notes.length)] : [])].join(" · "), undo || undefined);
  const added = results.find(r => r.doc);
  if (added && list.length === 1) select(added.doc.id);
}

// ---- ask the knowledge base ----
let askAbort = null;
async function askAi() {
  const question = state.q.trim();
  if (!question) { toast(T.askEmpty); $("q").focus(); return; }
  askAbort?.abort();
  const abort = askAbort = new AbortController();
  state.answer = { question, loading: true };
  renderList();
  try {
    const res = await fetch("/api/kb/ask", { method: "POST", signal: abort.signal, headers: { "x-token": TOKEN, "content-type": "application/json" }, body: JSON.stringify({ question, model: models.pick || undefined }) });
    const data = await res.json().catch(() => ({}));
    if (abort !== askAbort) return;
    if (!res.ok) {
      const [problem, ...detail] = String(data.error || `HTTP ${res.status}`).split(": ");
      if (problem === "cancelled") { state.answer = null; renderList(); return; }
      const say = T.askProblems[problem];
      throw new Error(typeof say === "function" ? say(detail.join(": ")) : say || data.error);
    }
    state.answer = { question, result: data };
  } catch (e) {
    if (abort.signal.aborted) return;
    state.answer = { question, error: e.message === "Failed to fetch" ? T.offline : e.message };
  }
  renderList();
}
$("askBtn").addEventListener("click", askAi);

$("preview").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  const id = state.selected, doc = state.doc?.doc;
  if (b.id === "back") { $("app").classList.remove("detail"); return; }
  if (b.id === "semOpen") return openSemantic();
  if (b.dataset.note) return select(b.dataset.note);
  if (b.dataset.tag) { showView("tag:" + b.dataset.tag); $("app").classList.remove("detail"); return; }
  if (b.id === "openOriginal") return openOriginal(id, Number(b.dataset.page) || null);
  if (b.dataset.page && b.closest(".page-mark")) return openOriginal(id, Number(b.dataset.page));
  if (b.id === "editNote") { state.editing = true; renderPreview(); return; }
  if (b.id === "moveDoc" && doc) {
    const to = b.dataset.to;
    if (!confirm(to === "project" ? T.moveConfirm.project(doc.title, state.status.project.name) : T.moveConfirm.global(doc.title))) return;
    try { const r = await api("/move", { body: { id, to } }); state.doc = null; state.selected = r.doc.id; etags = {}; await refresh(); renderPreview(); toast(T.moved[to]); }
    catch (err) { toast(err.message); }
    return;
  }
  if (b.id === "cancelEdit") { state.editing = false; renderPreview(); return; }
  if (b.id === "saveNote") {
    try { await api("/note", { body: { id, text: $("noteText").value } }); state.editing = false; state.doc = null; etags = {}; await refresh(); renderPreview(); toast(T.saved); }
    catch (err) { toast(err.message); }
    return;
  }
  if (b.id === "convertDoc" && doc) {
    if (!confirm(doc.collection === "wiki" ? T.toDocsConfirm(doc.title) : T.toNoteConfirm(doc.title))) return;
    try {
      const { result } = await api("/convert", { body: { id } });
      if (!result.doc) { toast(`${doc.title}: ${T.reasons[result.reason] ?? result.message ?? ""}`); return; }
      etags = {}; await refresh();
      select(result.doc.id);
      toast(T.converted[result.doc.collection](result.doc.title));
    } catch (err) { toast(err.message); }
    return;
  }
  if (b.id === "rereadDoc" && doc) {
    if (!confirm(T.rereadConfirm(doc.title))) return;
    b.disabled = true;
    try {
      const { job } = await api("/reread", { body: { id } });
      const [result] = await waitJobs([job]);
      renderList();
      if (result?.status === "updated") {
        state.doc = null; etags = {}; await refresh();
        if (state.selected === id) renderPreview();
        toast(T.rereadDone(doc.title));
      } else if (result) toast(`${doc.title}: ${T.reasons[result.reason] ?? result.message ?? ""}`);
    } catch (err) { toast(T.reasons[err.message] ?? err.message); b.disabled = false; }
    return;
  }
  if (b.id === "removeDoc" && doc) {
    if (!confirm(doc.collection === "wiki" ? T.confirmRemoveNote(doc.title) : T.confirmRemoveDoc(doc.title))) return;
    try {
      await api("/remove", { body: { id } });
      state.selected = null; state.doc = null; $("app").classList.remove("detail");
      if (state.hits) state.hits = state.hits.filter(h => h.docId !== id);
      etags = {}; await refresh(); renderPreview(); toast(T.removed);
    } catch (err) { toast(err.message); }
  }
});

// ---- semantic search settings ----
const sem = { info: null, ocr: null, mode: "off", clearKey: false, poll: null };
const fmtSize = n => n >= 1e9 ? `${(n / 1e9).toFixed(1)} GB` : `${Math.max(1, Math.round(n / 1e6))} MB`;
function renderSemantic() {
  const info = sem.info, f = $("semDlg").querySelector("form");
  if (!info) return;
  $("semSeg").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === sem.mode));
  f.querySelectorAll("[data-mode]").forEach(el => el.hidden = el.dataset.mode !== sem.mode);
  $("semLocalHint").textContent = T.semLocalHint(info.local.model, info.local.installed, fmtSize(info.local.bytes));
  const key = info.api.keySaved && !sem.clearKey;
  $("semKeyHint").innerHTML = [key ? esc(T.semKeySaved) : info.api.keyEnv ? esc(T.semKeyEnv(info.api.keyEnv)) : esc(T.semKeyNone),
    key ? `<button type="button" class="link" id="semClearKey">${esc(T.semKeyClear)}</button>` : ""].join(" ");
  f.apiKey.placeholder = key ? "••••••••" : "";
  const installing = info.installing != null;
  // Show a problem only next to the choice it belongs to.
  const problem = sem.mode === "local" && info.installError ? T.semInstallError(info.installError)
    : sem.mode === info.provider && info.provider !== "off" ? (info.problem ? T.semProblem[info.problem] : info.error ?? "") : "";
  $("semState").hidden = !(installing && sem.mode === "local") && !problem;
  $("semState").classList.toggle("bad", !installing && !!problem);
  $("semState").textContent = installing && sem.mode === "local" ? T.semInstallingLong(info.installing) : problem;
  $("semSave").disabled = installing;
  $("semRemove").hidden = !info.local.bytes || installing;
  $("semRemove").className = "link";
  $("semRemove").textContent = T.semRemoveBtn(fmtSize(info.local.bytes));
}
async function loadSemantic(fill) {
  sem.info = await api("/semantic");
  if (fill) {
    const f = $("semDlg").querySelector("form"), i = sem.info;
    sem.ocr = await api("/ocr");
    renderLocation(await api("/location"));
    f.locDir.value = ""; f.locCopy.checked = true;
    const langs = { ...T.ocrLangs };
    if (!langs[sem.ocr.language]) langs[sem.ocr.language] = T.ocrOther(sem.ocr.language);
    f.ocrLanguage.innerHTML = Object.entries(langs).map(([v, label]) => `<option value="${esc(v)}">${esc(label)}</option>`).join("");
    f.ocrLanguage.value = sem.ocr.language; f.ocrServer.value = sem.ocr.serverUrl;
    sem.mode = i.provider; sem.clearKey = false;
    f.baseUrl.value = i.api.baseUrl; f.model.value = i.api.model; f.apiKey.value = "";
    f.hfEndpoint.value = i.local.hfEndpoint; f.npmRegistry.value = i.local.npmRegistry;
  }
  renderSemantic();
  // Follow an install until it ends, then show the result.
  clearTimeout(sem.poll);
  if (sem.info.installing != null && $("semDlg").open) sem.poll = setTimeout(() => loadSemantic(false).catch(() => {}), 1500);
}
async function openSemantic() {
  $("semErr").hidden = true;
  try { await loadSemantic(true); $("semDlg").showModal(); } catch (e) { toast(e.message); }
}
$("semDlg").addEventListener("close", () => clearTimeout(sem.poll));
$("semDlg").addEventListener("click", async e => {
  if (e.target.closest("[data-close]")) return $("semDlg").close();
  const b = e.target.closest("button"); if (!b) return;
  if (b.closest("#semSeg")) { sem.mode = b.dataset.v; renderSemantic(); return; }
  if (b.id === "semClearKey") { sem.clearKey = true; renderSemantic(); return; }
  if (b.id === "semRemove") {
    const size = fmtSize(sem.info.local.bytes);
    if (!confirm(T.semRemoveConfirm(size))) return;
    try { await api("/semantic/remove", { body: {} }); toast(T.semRemoved(size)); etags.status = ""; await refresh(); await loadSemantic(true); }
    catch (err) { toast(err.message); }
  }
});
$("semDlg").querySelector("form").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, info = sem.info, mode = sem.mode;
  // A new location typed in but not applied with its own button: Save applies it too, rather than dropping it silently.
  const done = [];
  const dir = f.locDir.value.trim();
  if (dir) {
    const moved = await moveLocation(dir, true);
    if (!moved) return;
    done.push(moved);
  }
  const ocr = { language: f.ocrLanguage.value, serverUrl: f.ocrServer.value.trim() };
  const ocrChanged = ocr.language !== sem.ocr.language || ocr.serverUrl !== sem.ocr.serverUrl;
  const body = {
    provider: mode,
    api: { baseUrl: f.baseUrl.value.trim(), model: f.model.value.trim(), apiKey: f.apiKey.value, clearKey: sem.clearKey },
    local: { hfEndpoint: f.hfEndpoint.value.trim(), npmRegistry: f.npmRegistry.value.trim() },
  };
  // Leave semantic search alone when only OCR changed: saving "local" again would reinstall a missing runtime.
  const semChanged = mode !== info.provider || body.api.apiKey || sem.clearKey
    || (mode === "api" && (body.api.baseUrl !== info.api.baseUrl || body.api.model !== info.api.model))
    || (mode === "local" && (body.local.hfEndpoint !== info.local.hfEndpoint || body.local.npmRegistry !== info.local.npmRegistry));
  // Say what leaves the machine, or what gets downloaded, before switching to it.
  if (semChanged && mode === "api" && (info.provider !== "api" || body.api.baseUrl !== info.api.baseUrl)) {
    let host; try { host = new URL(body.api.baseUrl).host; } catch { host = body.api.baseUrl; }
    if (!confirm(T.semApiConfirm(host))) return;
  }
  if (semChanged && mode === "local" && info.provider !== "local" && !info.local.installed && !confirm(T.semLocalConfirm)) return;
  try {
    if (ocrChanged) { sem.ocr = await api("/ocr", { body: ocr }); done.push(T.ocrSaved); }
    if (semChanged) {
      const r = await api("/semantic", { body });
      etags.status = ""; await refresh();
      if (r.installing != null) { toast(T.semSavedInstalling); await loadSemantic(false); return; }
      done.push(r.provider === "off" ? T.semSavedOff : r.provider === "api" ? T.semSavedApi : T.semSavedLocal);
    }
    $("semDlg").close();
    if (done.length) toast(done.join(" · "));
  } catch (err) { $("semErr").textContent = err.message; $("semErr").hidden = false; }
});

// ---- location ----
let where = null;
function renderLocation(loc) {
  where = loc;
  $("locDir").textContent = loc.dir;
  $("locSource").textContent = T.locSource[loc.source] || loc.source;
  $("locEdit").hidden = loc.source === "env";
  $("locEnv").hidden = loc.source !== "env";
  $("locReset").hidden = loc.source !== "config";
}
/** Switch to `dir` ("" = the default), after asking. Returns what to tell the user, or undefined when cancelled or refused. */
async function moveLocation(dir, quiet = false) {
  const f = $("semDlg").querySelector("form"), copy = f.locCopy.checked;
  const shown = dir || where.localDir;
  if (!confirm(copy ? T.locConfirmCopy(shown, where.docs, where.notes) : T.locConfirmUse(shown))) return;
  $("semErr").hidden = true;
  try {
    const loc = await api("/location", { body: { dir, copy } });
    renderLocation(loc); f.locDir.value = "";
    etags = {}; await refresh();
    const said = T.locMoved(loc.dir, loc.docs, loc.notes);
    if (!quiet) toast(said);
    return said;
  } catch (err) {
    const [problem, ...detail] = err.message.split(": ");
    const say = T.locProblems[problem];
    $("semErr").textContent = typeof say === "function" ? say(detail.join(": ")) : say || err.message;
    $("semErr").hidden = false;
  }
}
$("locMove").addEventListener("click", () => {
  const dir = $("semDlg").querySelector("form").locDir.value.trim();
  if (!dir) { $("semDlg").querySelector("form").locDir.focus(); return; }
  moveLocation(dir);
});
$("locReset").addEventListener("click", () => moveLocation(""));

// Drag files anywhere: Markdown becomes notes, everything else documents.
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types ?? [])].includes("Files");
document.addEventListener("dragenter", e => { if (!hasFiles(e)) return; dragDepth++; $("drop").hidden = false; });
document.addEventListener("dragleave", e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $("drop").hidden = true; } });
document.addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
document.addEventListener("drop", e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0; $("drop").hidden = true;
  upload(e.dataTransfer.files);
});

renderAll();
// Deep links: /kb/?q=<query> runs a search; /kb/?doc=<id>&page=<n> opens a document at a page.
const link = new URLSearchParams(location.search);
refresh().then(() => {
  if (link.get("q")) { state.q = link.get("q"); $("q").value = state.q; search(); }
  if (link.get("doc")) select(link.get("doc"), Number(link.get("page")) || null);
});
setInterval(() => { if (!document.hidden) refresh(); }, 10000);
window.addEventListener("focus", () => { refresh(); loadModels(); });
loadModels();
</script>
</body>
